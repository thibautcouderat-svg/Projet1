<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sondage officiel — Que pensez-vous de Thibaut ?</title>
  <meta name="description" content="Sondage officiel et totalement impartial sur Thibaut." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Éléments lumineux d'ambiance, purement décoratifs -->
  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>

  <main class="app">

    <!-- ===================== ÉCRAN SONDAGE ===================== -->
    <section id="survey-screen" class="card" aria-live="polite">

      <header class="survey-header">
        <h1>Sondage officiel</h1>
        <p class="subtitle">Que pensez-vous de Thibaut ?</p>
        <p class="disclaimer">
          Votre avis est important. Les résultats seront analysés par notre comité totalement impartial.
        </p>
      </header>

      <div class="progress-wrapper">
        <div class="progress-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress-track">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <p class="question-counter" id="question-counter">Question 1 / 9</p>
      </div>

      <div class="question-box">
        <p class="question-text" id="question-text"></p>

        <div class="buttons-row">
          <button
            id="btn-oui"
            class="btn btn-oui"
            type="button"
            aria-label="Répondre Oui"
          >
            Oui
          </button>

          <button
            id="btn-non"
            class="btn btn-non"
            type="button"
            aria-label="Répondre Non"
          >
            Non
          </button>
        </div>

        <p class="attempts-counter" id="attempts-counter" hidden>
          Tentatives : <span id="attempts-count">0</span>
        </p>

        <p class="hint-text" id="hint-text" aria-hidden="true"></p>
      </div>

    </section>

    <!-- ===================== ÉCRAN RÉSULTAT ===================== -->
    <section id="result-screen" class="card" hidden aria-live="polite">
      <h1 class="result-title">SONDAGE TERMINÉ</h1>
      <p class="result-subtitle">Merci !</p>

      <button id="btn-restart" class="btn btn-restart" type="button">
        Recommencer le sondage
      </button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
